<html>
    <head>
        <title>The Key To Me</title>
        <style>
            body{
                 display: flex;
                 flex-direction: column;
                 justify-content: center;
                 align-items: center;
                min-height: 100vh;
                margin: 0;
                color:white;
                background-color: rgb(5, 4, 17);
            }
            button{
                background-color: rgb(5, 4, 17);
                color: white;
                border: 2px solid rgb(255, 0, 0);
                border-radius: 5px;
                padding: 10px 20px;
                font-size: 16px;
            }
            .door{
                background-color: rgb(36, 35, 41);
                color: white;
                border: 2px solid rgb(255, 0, 0);
                border-radius: 5px;
                padding: 10px;
                font-size: 16px;
            }
            .MyBody h1 {
                flex-basis: 100%;
                text-align: center;
            }
            .MyBody{
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                border-radius: 5px;
                padding: 10px;
                font-size: 16px;
                border: 2px solid #ff0033;
                box-shadow: 
                    0 0 10px #ff0033,
                    0 5px 0px #ff0033,
                    0 12px 2px #cc0000,
                    0 22px 6px #990000,
                    inset 0 0 15px rgba(255, 0, 51, 0.4);
                gap: 10px;
            }
            #result {
                flex-basis: 100%;
                text-align: center;
            }
        </style>
        <script>
            function checkKey() {
                var key = document.getElementById("keyInput").value;
                const keyGuide = {
                    'a':'@', 'b':';', 'c':"'", 'd':'$', 'e':'3', 'f':'_', 'g':'&', 'h':'-', 'i':'8', 'j':'+',
                    'k':'(', 'l':')', 'm':'?', 'n':'!', 'o':'9', 'p':'0', 'q':'1', 'r':'4', 's':'#', 't':'5',
                    'u':'7', 'v':':', 'w':'2', 'x':'"', 'y':'6', 'z':'*',
                    'A':'@', 'B':';', 'C':"'", 'D':'$', 'E':'3', 'F':'_', 'G':'&', 'H':'-', 'I':'8', 'J':'+',
                    'K':'(', 'L':')', 'M':'?', 'N':'!', 'O':'9', 'P':'0', 'Q':'1', 'R':'4', 'S':'#', 'T':'5',
                    'U':'7', 'V':':', 'W':'2', 'X':'"', 'Y':'6', 'Z':'*',
                    '@':'a', ';':'b', "'":'c', '$':'d', '3':'e', '_':'f', '&':'g', '-':'h', '8':'i', '+':'j',
                    '(':'k', ')':'l', '?':'m', '!':'n', '9':'o', '0':'p', '1':'q', '4':'r', '#':'s', '5':'t',
                    '7':'u', ':':'v', '2':'w', '"':'x', '6':'y', '*':'z',
                };
                const TheHeartsOpening = key.replace(/./g, char => keyGuide[char] || char);
                document.getElementById("result").textContent = TheHeartsOpening;
            }
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    checkKey();
                }
            });
        </script>
    </head>
    <body>
        <div class="MyBody">
            <h1>A Key To Me</h1>
            <input class="door" type="text" id="keyInput" placeholder="Enter">
            <button onclick="checkKey()">Reveal</button>
            <br>
            <h2 id="result"></h2>
        </div>
    </body>
</html>
