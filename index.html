<html>
    <head>
        <title>The Key To Me</title>
        <style>
            body{
                 display: flex;
                 flex-direction: column;
                 justify-content: center;
                 align-items: center;
                min-height: 100vh;
                margin: 0;
                color:white;
                background-color: rgb(5, 4, 17);
            }
            button{
                background-color: rgb(5, 4, 17);
                color: white;
                border: 2px solid rgb(255, 0, 0);
                border-radius: 5px;
                padding: 10px 20px;
                font-size: 16px;
            }
            .door{
                background-color: rgb(36, 35, 41);
                color: white;
                border: 2px solid rgb(255, 0, 0);
                border-radius: 5px;
                padding: 10px;
                font-size: 16px;
            }
            .MyBody h1 {
                flex-basis: 100%;
                text-align: center;
            }
            .MyBody{
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                border-radius: 5px;
                padding: 10px;
                font-size: 16px;
                border: 2px solid #ff0033;
                box-shadow: 
                    0 0 10px #ff0033,
                    0 5px 0px #ff0033,
                    0 12px 2px #cc0000,
                    0 22px 6px #990000,
                    inset 0 0 15px rgba(255, 0, 51, 0.4);
                gap: 10px;
            }
            #result {
                flex-basis: 100%;
                text-align: center;
            }
        </style>
        <script>
            function checkKey() {
                var key = document.getElementById("keyInput").value;
                var everchangingLiminality;
                const keyGuide = {
                    'a':')', 'b':'6', 'c':';', 'd':'8', 'e':'=', 'f':'3',
                    'g':'9', 'h':'*', 'i':':', 'j':'2', 'k':'', 'l':'-',
                    'm':'5', 'n':'!', 'o':'9', 'p':'0', 'q':'$', 'r':'&',
                    's':'?', 't':'+', 'u':"'", 'v':'_', 'w':'1', 'x':'"',
                    'y':'@', 'z':'0',
                    'A':')', 'B':'6', 'C':';', 'D':'8', 'E':'=', 'F':'3',
                    'G':'9', 'H':'*', 'I':':', 'J':'2', 'K':'/', 'L':'-',
                    'M':'5', 'N':'!', 'O':'9', 'P':'0', 'Q':'$', 'R':'&',
                    'S':'?', 'T':'+', 'U':"'", 'V':'_', 'W':'1', 'X':'"',
                    'Y':'@', 'Z':'0',
                    ')':'a', '6':'b', ';':'c', '8':'d', '=':'e', '3':'f',
                    '9':'g', '*':'h', ':':'i', '2':'j', '/':'k', '-':'l',
                    '5':'m', '!':'n', '9':'o', '0':'p', '$':'q', '&':'r',
                    '?':'s', '+':'t', "'":'u', '_':'v', '1':'w', '"':'x',
                    '@':'y', '0':'z',
                };
                const TheHeartsOpening = key.replace(/./g, char => keyGuide[char] || char);
                document.getElementById("result").textContent = TheHeartsOpening;
            }
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    checkKey();
                }
            });
        </script>
    </head>
    <body>
        <div class="MyBody">
            <h1>A Key To Me</h1>
            <input class="door" type="text" id="keyInput" placeholder="Use key">
            <button onclick="checkKey()">Reveal</button>
            <br>
            <h2 id="result"></h2>
        </div>
    </body>
</html>
